; ── OPcache optimizado para Docker Windows (bind-mount) ──────────────
; validate_timestamps=0 elimina todos los stat() de disco en archivos
; cacheados. El mayor cuello de botella en Docker+Windows bind mount.
; Para reflejar cambios de PHP: docker restart laravel_app
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=32
opcache.revalidate_freq=0
opcache.validate_timestamps=0

; JIT (PHP 8.4) — compilación nativa para hot paths
opcache.jit=tracing
opcache.jit_buffer_size=128M

; Realpath cache grande → menos stat() para rutas de archivos
realpath_cache_size=4096K
realpath_cache_ttl=600
