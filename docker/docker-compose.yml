
services:

  # ── Aplicación PHP-FPM ──────────────────────────────────────
  # Ejecuta el código Laravel. Habla FastCGI (puerto 9000).
  # Nginx recibe el request HTTP y lo delega aquí.
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: laravel_app
    volumes:
      - ..:/var/www
    depends_on:
      - db
    restart: on-failure

  # ── Queue Worker ─────────────────────────────────────────────
  # Procesa los Jobs en background (QUEUE_CONNECTION=database).
  # Es el MISMO contenedor que "app" pero con comando diferente.
  # Sin este servicio los Jobs quedan en la tabla "jobs" para siempre.
  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: laravel_queue
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - ..:/var/www
    depends_on:
      - app
      - db
    restart: on-failure

  # ── Nginx (Reverse Proxy) ─────────────────────────────────────
  # Punto de entrada único de todo el tráfico HTTP.
  # Sirve assets estáticos directamente (sin pasar por PHP).
  # Enruta /api/ y el resto a php_fpm via FastCGI.
  # En el futuro enrutará sub-paths a microservicios HTTP separados.
  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - ..:/var/www
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - app
    restart: on-failure

  # ── Base de datos MySQL ───────────────────────────────────────
  db:
    image: mysql:8
    container_name: laravel_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: GoToEat
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # ── phpMyAdmin ───────────────────────────────────────────────
  # Interfaz web para administrar la BD. Solo para desarrollo.
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

