
services:

  # ── Aplicación PHP-FPM ──────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: laravel_app
    volumes:
      - ..:/var/www
    depends_on:
      - db
      - redis
    restart: on-failure
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # ── Queue Worker (AI + Finance + Inventory queues) ───────────
  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: laravel_queue
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --queue=ai,finance,inventory,default
    volumes:
      - ..:/var/www
    depends_on:
      - app
      - db
      - redis
    restart: on-failure
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # ── Nginx (Reverse Proxy) ─────────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - ..:/var/www
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - app
    restart: on-failure

  # ── MySQL 8 ───────────────────────────────────────────────────
  db:
    image: mysql:8
    container_name: laravel_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: GoToEat
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # ── phpMyAdmin ───────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

  # ── Microservicio IA (activar cuando se implemente) ───────────
  # ai_service:
  #   build:
  #     context: ../services/ai
  #     dockerfile: Dockerfile
  #   container_name: gotoeat_ai
  #   ports:
  #     - "8001:8001"
  #   environment:
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #   restart: on-failure

volumes:
  db_data:
  redis_data:
