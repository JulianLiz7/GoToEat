# GoToEat - Nginx Reverse Proxy Configuration
# Servicios activos:
#   app (php-fpm) -> Laravel 12, PHP 8.4, Web UI + API + Auth
# Servicios futuros (comentados):
#   notif_service -> WebSockets / Broadcasting

# ── Upstream PHP-FPM ──────────────────────────────────────────────────
upstream php_fpm {
    server app:9000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root  /var/www/public;
    index index.php index.html;
    charset utf-8;

    # ── Limite de body (uploads de comprobantes, imagenes de menu) ────
    client_max_body_size 25M;
    client_body_timeout  60s;

    # ── Cabeceras de seguridad ────────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-XSS-Protection        "1; mode=block"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Compresion Gzip ───────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json
                      application/javascript text/xml application/xml
                      image/svg+xml application/x-font-ttf font/opentype;

    # ── Health-check (monitoreo Azure / orquestadores) ────────────────
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Assets estaticos (CSS, JS, imagenes, fuentes) ─────────────────
    # Nginx los sirve directamente sin pasar por PHP.
    # Cache 7 dias + immutable = el navegador no revalida.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot|map|pdf)$ {
        expires            7d;
        add_header         Cache-Control "public, immutable";
        try_files          $uri =404;
        access_log         off;
        log_not_found      off;
    }

    # ── Storage publico (comprobantes, imagenes subidas) ──────────────
    location /storage/ {
        alias /var/www/public/storage/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
        access_log off;
    }

    # ── Endpoint AI (timeout extendido para llamadas a Gemini API) ────
    # El AI Assistant llama a la API de Google Gemini (externa).
    # El job se procesa en cola, pero las respuestas pueden tardar.
    location ~ ^/admin/ai {
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass              php_fpm;
            fastcgi_index             index.php;
            include                   fastcgi_params;
            fastcgi_param             SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout      120s;
            fastcgi_send_timeout      120s;
            fastcgi_connect_timeout   10s;
            fastcgi_buffer_size       128k;
            fastcgi_buffers           8 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }

    # ── API v1 (endpoints de reportes, exports, integraciones) ───────
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass              php_fpm;
            include                   fastcgi_params;
            fastcgi_param             SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout      300s;
            fastcgi_send_timeout      300s;
            fastcgi_buffer_size       128k;
            fastcgi_buffers           8 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }

    # ── Aplicacion principal ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM principal ─────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass              php_fpm;
        fastcgi_index             index.php;
        include                   fastcgi_params;
        fastcgi_param             SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout      300s;
        fastcgi_send_timeout      300s;
        fastcgi_connect_timeout   10s;
        fastcgi_buffer_size       128k;
        fastcgi_buffers           8 256k;
        fastcgi_busy_buffers_size 512k;
        fastcgi_intercept_errors  off;
    }

    # ── Bloquear archivos ocultos (.env, .git, etc.) ──────────────────
    location ~ /\.(?!well-known).* {
        deny   all;
        return 404;
    }
}
