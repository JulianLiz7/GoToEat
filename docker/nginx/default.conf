# =============================================================
#  GoToEat – Nginx como Reverse Proxy
# =============================================================
#
#  SERVICIOS ACTUALES:
#    app (php_fpm)  →  Laravel 12 + PHP-FPM 8.2
#                      Web UI, API v1, Auth, Livewire
#
#  SERVICIOS FUTUROS (descomentar cuando se agreguen al
#  docker-compose.yml):
#    ai_service     →  Microservicio de Inteligencia Artificial
#    notif_service  →  Microservicio de Notificaciones / WebSockets
# =============================================================


# ── Upstream: PHP-FPM ─────────────────────────────────────────
# Define el pool de workers del dominio "app" (nombre del servicio
# en docker-compose). Usa protocolo FastCGI (no HTTP), por eso
# más adelante se usa fastcgi_pass en lugar de proxy_pass.
# FastCGI es binario y más eficiente que HTTP para PHP local.
upstream php_fpm {
    server app:9000;
    keepalive 8;
}


# ── Upstream: Microservicio IA (comentado hasta que exista) ───
# Cuando el servicio AI sea un proceso HTTP independiente
# (ej: FastAPI, Node.js, otro Laravel) se descomenta esto
# y se agrega el servicio correspondiente en docker-compose.
#
# upstream ai_service {
#     server ai_service:8001;
#     keepalive 16;
# }


# ── Upstream: Microservicio de Notificaciones (comentado) ─────
# upstream notif_service {
#     server notif_service:6001;
#     keepalive 8;
# }


server {
    listen 80;
    server_name localhost;

    root  /var/www/public;
    index index.php index.html;
    charset utf-8;

    # Tamaño máximo de body (uploads de imágenes de menú, logos, etc.)
    client_max_body_size 20M;


    # ── Cabeceras de seguridad ─────────────────────────────────
    # Se envían en TODA respuesta. Protegen contra clickjacking,
    # MIME-sniffing y XSS.
    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header X-XSS-Protection       "1; mode=block"                always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;


    # ── Compresión Gzip ───────────────────────────────────────
    # Reduce el tamaño de respuestas de texto antes de enviarlas.
    # CSS/JS/JSON comprimidos = menos datos por la red.
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/json
                    application/javascript text/xml application/xml
                    image/svg+xml;


    # ── Health-check de Nginx ─────────────────────────────────
    # Endpoint liviano para monitoreo / orquestadores (k8s, etc.).
    # No llega a PHP, Nginx responde directamente.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }


    # ── Assets estáticos ──────────────────────────────────────
    # Nginx los sirve DIRECTAMENTE desde /var/www/public sin
    # pasar por PHP. Esto es una de las mayores ventajas de
    # poner Nginx delante de PHP-FPM.
    # Cache de 7 días + immutable = el navegador no revalida.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }


    # ── API v1 → Laravel (FastCGI) ────────────────────────────
    # Se separa del bloque principal para poder aplicar
    # timeouts más largos (endpoints de reportes, IA, exports).
    # En el futuro, algunos sub-paths se redirigen a otros servicios.
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;

        # Sub-path de IA → microservicio HTTP independiente (futuro)
        # location /api/v1/ai/ {
        #     proxy_pass         http://ai_service/;
        #     proxy_http_version 1.1;
        #     proxy_set_header   Host              $host;
        #     proxy_set_header   X-Real-IP         $remote_addr;
        #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header   X-Forwarded-Proto $scheme;
        #     proxy_set_header   Connection        "";
        #     proxy_read_timeout 90s;
        # }

        location ~ \.php$ {
            fastcgi_pass           php_fpm;
            include                fastcgi_params;
            fastcgi_param          SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout   120s;
            fastcgi_buffer_size    128k;
            fastcgi_buffers        8 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }


    # ── Notificaciones en tiempo real → servicio WS (futuro) ──
    # WebSockets requieren upgrade de protocolo HTTP → WS.
    # location /broadcasting/ {
    #     proxy_pass          http://notif_service/;
    #     proxy_http_version  1.1;
    #     proxy_set_header    Upgrade    $http_upgrade;
    #     proxy_set_header    Connection "upgrade";
    #     proxy_set_header    Host       $host;
    #     proxy_read_timeout  3600s;
    # }


    # ── Aplicación principal → Laravel ────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    # ── PHP-FPM (FastCGI) ─────────────────────────────────────
    # Todo archivo .php que no fue capturado antes llega aquí.
    # fastcgi_pass habla FastCGI con el contenedor "app".
    location ~ \.php$ {
        fastcgi_pass              php_fpm;
        fastcgi_index             index.php;
        include                   fastcgi_params;
        fastcgi_param             SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout      300s;
        fastcgi_send_timeout      300s;
        fastcgi_connect_timeout   10s;
        fastcgi_buffer_size       128k;
        fastcgi_buffers           8 256k;
        fastcgi_busy_buffers_size 512k;
        fastcgi_intercept_errors  off;
    }


    # ── Bloquear archivos ocultos ─────────────────────────────
    # Ningún .env, .git, .htaccess debe ser accesible desde HTTP.
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }
}
